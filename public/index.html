<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006948" />
    <meta
      name="description"
      content="RentLanka - Sri Lanka's Premier Peer-to-Peer Rental Marketplace for Vehicles, Heavy Machinery, Cinema Equipment, Tools & Event Gear"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS Engine with Lush Verity Design Tokens -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#006948",
              "on-primary": "#ffffff",
              "primary-container": "#00855d",
              "on-primary-container": "#f5fff7",
              "primary-fixed": "#85f8c4",
              "primary-fixed-dim": "#68dba9",
              "on-primary-fixed": "#002114",
              "on-primary-fixed-variant": "#005137",
              secondary: "#565e74",
              "on-secondary": "#ffffff",
              "secondary-container": "#dae2fd",
              "on-secondary-container": "#5c647a",
              "secondary-fixed": "#dae2fd",
              "secondary-fixed-dim": "#bec6e0",
              "on-secondary-fixed": "#131b2e",
              "on-secondary-fixed-variant": "#3f465c",
              tertiary: "#006947",
              "on-tertiary": "#ffffff",
              "tertiary-container": "#00855b",
              "on-tertiary-container": "#f5fff6",
              "tertiary-fixed": "#6ffbbe",
              "tertiary-fixed-dim": "#4edea3",
              "on-tertiary-fixed": "#002113",
              "on-tertiary-fixed-variant": "#005236",
              error: "#ba1a1a",
              "on-error": "#ffffff",
              "error-container": "#ffdad6",
              "on-error-container": "#93000a",
              background: "#f8f9ff",
              "on-background": "#0b1c30",
              surface: "#f8f9ff",
              "on-surface": "#0b1c30",
              "on-surface-variant": "#3d4a42",
              "surface-dim": "#cbdbf5",
              "surface-bright": "#f8f9ff",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#eff4ff",
              "surface-container": "#e5eeff",
              "surface-container-high": "#dce9ff",
              "surface-container-highest": "#d3e4fe",
              "surface-variant": "#d3e4fe",
              "inverse-surface": "#213145",
              "inverse-on-surface": "#eaf1ff",
              "inverse-primary": "#68dba9",
              outline: "#6d7a72",
              "outline-variant": "#bccac0",
              "surface-tint": "#006c4a"
            },
            fontFamily: {
              headline: ["'Plus Jakarta Sans'", "sans-serif"],
              body: ["'Inter'", "sans-serif"]
            },
            boxShadow: {
              glass: "0 12px 36px -6px rgba(0, 105, 72, 0.12), 0 4px 16px rgba(11, 28, 48, 0.06)",
              card: "0 4px 18px -2px rgba(15, 23, 42, 0.04), 0 2px 6px -1px rgba(15, 23, 42, 0.02)",
              "card-hover": "0 16px 36px -4px rgba(0, 105, 72, 0.12), 0 6px 16px -2px rgba(15, 23, 42, 0.06)"
            }
          }
        }
      };
    </script>

    <title>RentLanka — Sri Lanka's Peer-to-Peer Rental Marketplace</title>
  </head>
  <body class="bg-surface font-body text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
    <noscript>You need to enable JavaScript to run RentLanka.</noscript>
    <div id="root"></div>
  </body>
</html>
